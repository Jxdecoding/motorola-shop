<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motorola Shop — Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Motorola Shop</h1>
    <div class="cart-badge">
      Cart: <span id="cart-count">0</span>
    </div>
  </header>

  <main class="container">
    <article class="product-card">
      <div class="product-image" aria-hidden="true">
        <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="10" width="160" height="260" rx="22" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
          <rect x="30" y="30" width="140" height="220" rx="6" fill="#3b82f6"/>
          <circle cx="100" cy="265" r="6" fill="#0f172a"/>
        </svg>
      </div>
      <div class="product-info">
        <h2>Moto G Stylus 5G (2026)</h2>
        <p class="price">$399.99</p>
        <p class="desc">
          6.7&quot; display, 256 GB storage, AI-powered camera,
          built-in stylus. Free shipping on orders over $50.
        </p>
        <button id="add-to-cart-btn" class="cta">Add to Cart</button>
        <p class="hint" id="cart-status"></p>
      </div>
    </article>

    <footer class="footer">
      <p>Motorola CMSO Agentic AI Demo &middot; <a href="https://github.com/Jxdecoding/motorola-shop">source on GitHub</a></p>
    </footer>
  </main>

  <script src="shop.js"></script>
</body>
</html>
